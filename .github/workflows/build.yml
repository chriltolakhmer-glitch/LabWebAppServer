name: LabWebAppServer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (Release)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.400'
      - name: Restore
        run: dotnet restore LabWebAppServer.slnx
      - name: Build (Release)
        run: dotnet build LabWebAppServer.slnx -c Release --no-restore
      - name: Report acceptance boundary
        run: |
          Write-Output '::notice::All isolated Web tests run. Real Auth/API/SQL and browser/Postman acceptance are NOT RUN on this hosted runner. See docs/Release-Process.md.'
      - name: Test (Release)
        run: |
          Remove-Item Env:LABWEB_CONFIG_PATH -ErrorAction SilentlyContinue
          dotnet test LabWebAppServer.slnx -c Release --no-build --no-restore --logger "console;verbosity=normal"
